<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — elshod.me</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
        .nf-code { font-family: var(--font-mono); color: var(--ink-3); font-size: 14px; }
        .nf h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 8vw, 72px); line-height: 1; margin-top: 12px; }
        .nf p { margin-top: 16px; color: var(--ink-2); max-width: 44ch; }
        .nf .btn { margin-top: 28px; }
    </style>
</head>
<body>
    <main class="nf">
        <div>
            <p class="nf-code">404</p>
            <h1>Page not found</h1>
            <p>That address doesn't exist on elshod.me. Everything lives on the front page.</p>
            <a href="/" class="btn btn-primary">Back to the front page</a>
        </div>
    </main>
</body>
</html>
