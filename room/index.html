<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibodullayev — Interactive Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Manrope', sans-serif;
        }
        .workspace-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .workspace-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Interaktiv nuqtalar (Hotspots) */
        .hotspot {
            position: absolute;
            border: 2px dashed rgba(34, 197, 94, 0.7);
            background: rgba(34, 197, 94, 0.2);
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 10;
        }
        .hotspot:hover {
            background: rgba(34, 197, 94, 0.45);
            border-color: #22c55e;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
        }
        /* Tooltip (Ustiga borganda chiqadigan nom) */
        .hotspot::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hotspot:hover::after {
            opacity: 1;
        }

        /* Yuqori polka ikonkalari joylashuvi (Foiz nisbatida) */
        .hotspot-mulkchi   { top: 8%; left: 41.5%; width: 5.5%; height: 12%; }
        .hotspot-fluentuz  { top: 8%; left: 48.5%; width: 5.5%; height: 12%; }
        .hotspot-portfolio { top: 8%; left: 55.5%; width: 5.5%; height: 12%; }
        .hotspot-github    { top: 8%; left: 62.5%; width: 5.5%; height: 12%; }
        
        /* YouTube va Telegram joylashuvi (O'ng pastki qismdagi YouTube va boshqalar) */
        .hotspot-youtube   { top: 62%; left: 81%; width: 7%; height: 10%; }
        .hotspot-telegram  { top: 78%; left: 81%; width: 6%; height: 9%; }

        /* Orqaga qaytish tugmasi (Chap yuqori burchakda suzib turadi) */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.2s, transform 0.2s;
            z-index: 20;
        }
        .back-btn:hover {
            background: #22c55e;
            color: #0b0f19;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="workspace-container">
        <a href="../" class="back-btn">← Asosiy sahifa</a>

        <!-- Xona rasmi -->
        <img src="room.jpg" alt="Ibodullayev Workspace" class="workspace-img">
        
        <!-- Interaktiv havolalar (Hotspots) -->
        <a href="https://mulkchi.vercel.app/" target="_blank" class="hotspot hotspot-mulkchi" data-tooltip="Mulkchi (Real Estate)"></a>
        <a href="https://fluentuz.app/" target="_blank" class="hotspot hotspot-fluentuz" data-tooltip="FluentUZ (Speak English)"></a>
        <a href="https://elshod.me" target="_blank" class="hotspot hotspot-portfolio" data-tooltip="elshod.me Portfolio"></a>
        <a href="https://github.com/ElshodDev" target="_blank" class="hotspot hotspot-github" data-tooltip="GitHub Profile"></a>
        
        <!-- YouTube va Telegram havolalari -->
        <a href="https://youtube.com/@OfficialMakhammadivich" target="_blank" class="hotspot hotspot-youtube" data-tooltip="YouTube Kanalim"></a>
        <a href="https://t.me/Elshod_Makhammadivich_I" target="_blank" class="hotspot hotspot-telegram" data-tooltip="Telegram Kanalim"></a>
    </div>

</body>
</html>
