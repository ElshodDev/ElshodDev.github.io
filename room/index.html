<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibodullayev — Interactive Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .workspace-title {
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e2e8f0;
        }
        .workspace-title span {
            color: #22c55e;
        }
        .workspace-container {
            position: relative;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .workspace-img {
            width: 100%;
            display: block;
        }
        
        /* Interaktiv qismlar (Hotspots) */
        .hotspot {
            position: absolute;
            border: 2px dashed rgba(34, 197, 94, 0.7);
            background: rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .hotspot:hover {
            background: rgba(34, 197, 94, 0.45);
            border-color: #22c55e;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        /* Tooltip (Ustiga borganda chiqadigan yozuv) */
        .hotspot::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 108%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 5px 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hotspot:hover::after {
            opacity: 1;
        }

        /* Yuqoridagi monitordagi ikonkalarning joylashuvi (foizda) */
        .hotspot-mulkchi { top: 8%; left: 41.5%; width: 5.5%; height: 12%; }
        .hotspot-fluentuz { top: 8%; left: 48.5%; width: 5.5%; height: 12%; }
        .hotspot-portfolio { top: 8%; left: 55.5%; width: 5.5%; height: 12%; }
        .hotspot-github { top: 8%; left: 62.5%; width: 5.5%; height: 12%; }

        .back-btn {
            margin-top: 25px;
            padding: 10px 24px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
        }
        .back-btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .workspace-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <h2 class="workspace-title">Ibodullayev's <span>Interactive Workspace</span></h2>

    <div class="workspace-container">
        <!-- Rasm fayli -->
        <img src="room.jpg" alt="Ibodullayev Workspace" class="workspace-img">
        
        <!-- Bosiladigan havolalar (Hotspots) -->
        <a href="https://github.com/ElshodDev" target="_blank" class="hotspot hotspot-mulkchi" data-tooltip="Mulkchi (GitHub)"></a>
        <a href="https://fluentuz.app/" target="_blank" class="hotspot hotspot-fluentuz" data-tooltip="FluentUZ"></a>
        <a href="https://elshod.me" target="_blank" class="hotspot hotspot-portfolio" data-tooltip="elshod.me Portfolio"></a>
        <a href="https://github.com/ElshodDev" target="_blank" class="hotspot hotspot-github" data-tooltip="GitHub Profile"></a>
    </div>

    <a href="../" class="back-btn">← Asosiy sahifaga qaytish</a>

</body>
</html>
